name: SDKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdks-${{ github.ref }}
  cancel-in-progress: true

# Mêmes contrôles que le miroir sdks/ du dépôt SahelPay : tests unitaires,
# parité de signature avec le serveur (test-vectors/) et paquets publiables.
jobs:
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: javascript/package-lock.json
      - name: Install, typecheck, test (CJS + ESM), pack
        working-directory: javascript
        run: |
          npm ci
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=high
          npm pack --dry-run

  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none
      - name: Validate, install, test, audit
        working-directory: php
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer test
          composer audit --no-dev

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests and build
        working-directory: python
        run: |
          python -m unittest discover -s tests -v
          python -m pip install --quiet build
          python -m build --outdir "$RUNNER_TEMP/python-dist" .

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Mintlify — validate and check links
        working-directory: docs
        run: |
          npx --yes mint@latest validate
          npx --yes mint@latest broken-links
