name: SDKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdks-${{ github.ref }}
  cancel-in-progress: true

# Mêmes contrôles que le miroir sdks/ du dépôt SahelPay : tests unitaires,
# parité de signature avec le serveur (test-vectors/) et paquets publiables.
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: javascript/package-lock.json
      - name: Install, typecheck, test (CJS + ESM), pack
        working-directory: javascript
        run: |
          npm ci
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=high
          npm pack --dry-run

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d661a18133a0 # 2.35.2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none
      - name: Validate, install, test, audit
        working-directory: php
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer test
          composer audit --no-dev

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests and build
        working-directory: python
        run: |
          python -m unittest discover -s tests -v
          python -m pip install --quiet build
          python -m build --outdir "$RUNNER_TEMP/python-dist" .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Mintlify — validate and check links
        working-directory: docs
        run: |
          npx --yes mint@latest validate
          npx --yes mint@latest broken-links
